<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Create Account | Loomyva</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="icon" type="image/png" href="/assets/img/index.png" />
  <link rel="shortcut icon" type="image/png" href="/assets/img/index.png" />
  <link rel="apple-touch-icon" href="/assets/img/index.png" />

  <meta name="theme-color" content="#050816" />
  <meta name="description" content="Loomyva is a premium creator network for posting ideas, discovering builders, messaging people, and growing a social graph." />
  <meta name="application-name" content="Loomyva" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="/assets/css/style.css?v=polish-20260531" />

  <script>
    (function () {
      const savedTheme = localStorage.getItem("loomyva-theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
    })();
  </script>
</head>

<body data-auth-page="signup">
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <div class="bg-orb orb-one"></div>
  <div class="bg-orb orb-two"></div>

  <main id="mainContent" class="auth-page-shell">
    <section class="glass-card auth-page-card">
      <a class="brand auth-page-brand" href="/" aria-label="Loomyva home">
        <img src="/assets/img/index.png" alt="Loomyva logo" class="brand-logo" />
        <div>
          <h1>Loomyva</h1>
          <p>Create your creator account.</p>
        </div>
      </a>

      <div class="auth-page-copy">
        <span class="eyebrow">New account</span>
        <h2>Create Account</h2>
        <p>Choose your full name and username once. Your email stays private inside the app.</p>
      </div>

      <form id="emailAuthForm" class="sidebar-email-auth auth-page-form" data-auth-mode="signup">
        <input
          type="email"
          id="authEmail"
          class="sidebar-auth-input"
          placeholder="Email"
          autocomplete="email"
          required
        />

        <input
          type="text"
          id="authFullName"
          class="sidebar-auth-input"
          placeholder="Full name"
          autocomplete="name"
          maxlength="60"
          required
        />

        <input
          type="text"
          id="authUsername"
          class="sidebar-auth-input"
          placeholder="Username"
          autocomplete="username"
          maxlength="28"
          required
        />

        <div class="password-field-wrap">
          <input
            type="password"
            id="authPassword"
            class="sidebar-auth-input password-input"
            placeholder="Password"
            autocomplete="new-password"
            required
          />

          <button
            id="togglePasswordBtn"
            class="password-toggle-btn"
            type="button"
            aria-label="Show password"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5c5.5 0 9.5 5.1 10.8 6.9a.9.9 0 0 1 0 1.1C21.5 14.9 17.5 20 12 20S2.5 14.9 1.2 13a.9.9 0 0 1 0-1.1C2.5 10.1 6.5 5 12 5Zm0 2C7.9 7 4.7 10.4 3.3 12.5 4.7 14.6 7.9 18 12 18s7.3-3.4 8.7-5.5C19.3 10.4 16.1 7 12 7Zm0 2.2a3.3 3.3 0 1 1 0 6.6 3.3 3.3 0 0 1 0-6.6Zm0 2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z"></path>
            </svg>
          </button>
        </div>

        <button id="emailSignupBtn" class="btn primary-btn" type="submit">
          Create account
        </button>

        <a class="auth-switch-link" href="/login/">
          Already have an account? <strong>Log in</strong>
        </a>
      </form>

      <p id="statusMsg" class="status-msg hidden"></p>
    </section>
  </main>

  <script src="/assets/js/config.js?v=polish-20260531"></script>
  <script src="/assets/js/language.js?v=polish-20260531"></script>
  <script src="/assets/js/ui.js?v=polish-20260531"></script>
  <script src="/assets/js/auth.js?v=polish-20260531"></script>

  <script>
    setupAuthButtons();
    restoreSession();
    listenForAuthChanges();
  </script>

  <!-- iOS Safari/PWA cleanup: remove old service worker registrations -->
  <script>
    (function () {
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            })
            .then(function () {
              if (window.caches && caches.keys) {
                return caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                });
              }
            })
            .catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
