<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ThreadWave</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #eefbff;
      --bg-2: #d7f4ff;
      --card: rgba(255, 255, 255, 0.72);
      --card-strong: rgba(255, 255, 255, 0.92);
      --text: #071923;
      --muted: #6a7f89;
      --line: rgba(8, 45, 62, 0.1);
      --cyan: #00c8ff;
      --cyan-dark: #0099cc;
      --blue: #3b82f6;
      --danger: #ff4b6e;
      --shadow: 0 22px 60px rgba(8, 70, 95, 0.16);
      --radius: 28px;
    }

    body.dark {
      --bg: #061016;
      --bg-2: #0b1d26;
      --card: rgba(13, 31, 42, 0.72);
      --card-strong: rgba(17, 42, 56, 0.96);
      --text: #effaff;
      --muted: #9db1bb;
      --line: rgba(255, 255, 255, 0.1);
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(0, 200, 255, 0.28), transparent 34%),
        radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.16), transparent 30%),
        linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      border: none;
      outline: none;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px 14px 96px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 4px 18px;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 14px 32px rgba(0, 200, 255, 0.28);
      color: white;
      font-size: 20px;
    }

    .brand h1 {
      font-size: 1.22rem;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transition: 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .profile-card,
    .composer,
    .thread-card,
    .empty-card,
    .modal-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
    }

    .profile-card {
      padding: 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #00c8ff, #4f46e5);
      color: white;
      font-weight: 800;
      box-shadow: 0 12px 28px rgba(0, 200, 255, 0.25);
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-info h2 {
      font-size: 0.98rem;
      letter-spacing: -0.03em;
    }

    .profile-info p {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 3px;
    }

    .profile-stats {
      display: flex;
      gap: 10px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .profile-stats strong {
      color: var(--text);
    }

    .composer {
      padding: 16px;
      margin-bottom: 16px;
    }

    .composer-head {
      display: flex;
      gap: 12px;
    }

    .composer textarea {
      flex: 1;
      min-height: 88px;
      resize: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .composer textarea::placeholder {
      color: var(--muted);
    }

    .composer-bottom {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .char-count {
      color: var(--muted);
      font-size: 0.76rem;
    }

    .post-btn {
      padding: 12px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: white;
      font-weight: 800;
      box-shadow: 0 14px 30px rgba(0, 200, 255, 0.26);
      transition: 0.2s ease;
    }

    .post-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .post-btn:active {
      transform: scale(0.96);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      padding: 6px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .tab-btn {
      flex: 1;
      padding: 11px 12px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.82rem;
      transition: 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-strong);
      color: var(--text);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .thread-card {
      padding: 16px;
      animation: rise 0.32s ease both;
    }

    @keyframes rise {
      from {
        transform: translateY(10px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .thread-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .thread-main {
      flex: 1;
      min-width: 0;
    }

    .thread-author {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .thread-author h3 {
      font-size: 0.92rem;
      letter-spacing: -0.02em;
    }

    .thread-author span {
      color: var(--muted);
      font-size: 0.74rem;
      white-space: nowrap;
    }

    .thread-text {
      margin-top: 8px;
      font-size: 0.94rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .thread-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 11px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.34);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 0.78rem;
      font-weight: 700;
      transition: 0.18s ease;
    }

    body.dark .action-btn {
      background: rgba(255, 255, 255, 0.06);
    }

    .action-btn.active.like {
      color: var(--danger);
      background: rgba(255, 75, 110, 0.12);
    }

    .action-btn.active.repost {
      color: #00b894;
      background: rgba(0, 184, 148, 0.12);
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .delete-btn {
      margin-left: auto;
      color: var(--danger);
    }

    .comments {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      display: none;
    }

    .comments.open {
      display: block;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .comment {
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.42);
      color: var(--text);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    body.dark .comment {
      background: rgba(255, 255, 255, 0.07);
    }

    .comment small {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-weight: 700;
    }

    .comment-form {
      display: flex;
      gap: 8px;
    }

    .comment-form input {
      flex: 1;
      padding: 12px 13px;
      border-radius: 999px;
      background: var(--card-strong);
      color: var(--text);
      border: 1px solid var(--line);
      min-width: 0;
    }

    .comment-form button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: white;
      box-shadow: 0 10px 22px rgba(0, 200, 255, 0.22);
    }

    .empty-card {
      text-align: center;
      padding: 34px 20px;
      color: var(--muted);
    }

    .empty-card i {
      font-size: 2rem;
      color: var(--cyan);
      margin-bottom: 12px;
    }

    .empty-card h3 {
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(calc(100% - 28px), 520px);
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      z-index: 30;
    }

    .nav-btn {
      height: 52px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      font-size: 1.05rem;
      transition: 0.2s ease;
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: white;
      box-shadow: 0 12px 26px rgba(0, 200, 255, 0.24);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%) translateY(20px);
      background: var(--card-strong);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 50;
      backdrop-filter: blur(18px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(8px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: min(100%, 520px);
      padding: 18px;
      animation: modalUp 0.25s ease both;
    }

    @keyframes modalUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-card h2 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .modal-card label {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      margin: 12px 0 6px;
    }

    .modal-card input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 16px;
      background: var(--card-strong);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-actions button {
      flex: 1;
      padding: 13px 14px;
      border-radius: 18px;
      font-weight: 800;
    }

    .save-btn {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: white;
    }

    .cancel-btn {
      background: var(--card-strong);
      color: var(--text);
      border: 1px solid var(--line);
    }

    @media (max-width: 420px) {
      .app {
        padding-inline: 12px;
      }

      .profile-card,
      .composer,
      .thread-card {
        border-radius: 24px;
      }

      .brand h1 {
        font-size: 1.1rem;
      }

      .thread-actions {
        gap: 5px;
      }

      .action-btn {
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <i class="fa-solid fa-water"></i>
        </div>
        <div>
          <h1>ThreadWave</h1>
          <p>micro-posts with ocean energy</p>
        </div>
      </div>

      <div class="top-actions">
        <button class="icon-btn" id="profileBtn" aria-label="Edit profile">
          <i class="fa-regular fa-user"></i>
        </button>

        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
          <i class="fa-regular fa-moon"></i>
        </button>
      </div>
    </header>

    <section class="profile-card">
      <div class="avatar" id="profileAvatar">A</div>

      <div class="profile-info">
        <h2 id="profileName">Aurilumix</h2>
        <p id="profileHandle">@futurebillionaire</p>

        <div class="profile-stats">
          <span><strong id="postCount">0</strong> posts</span>
          <span><strong id="likeCount">0</strong> likes</span>
          <span><strong id="commentCount">0</strong> comments</span>
        </div>
      </div>
    </section>

    <section class="composer">
      <div class="composer-head">
        <div class="avatar" id="composerAvatar">A</div>

        <textarea
          id="postInput"
          maxlength="280"
          placeholder="Drop a wave..."
        ></textarea>
      </div>

      <div class="composer-bottom">
        <span class="char-count">
          <span id="charCount">0</span>/280
        </span>

        <button class="post-btn" id="postBtn" disabled>
          Post Wave
        </button>
      </div>
    </section>

    <nav class="tabs">
      <button class="tab-btn active" data-filter="all">All</button>
      <button class="tab-btn" data-filter="hot">Hot</button>
      <button class="tab-btn" data-filter="mine">Mine</button>
    </nav>

    <section class="feed" id="feed"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-filter="all" aria-label="Home">
      <i class="fa-solid fa-house"></i>
    </button>

    <button class="nav-btn" data-filter="hot" aria-label="Hot">
      <i class="fa-solid fa-fire"></i>
    </button>

    <button class="nav-btn" id="focusComposerBtn" aria-label="Create">
      <i class="fa-solid fa-plus"></i>
    </button>

    <button class="nav-btn" data-filter="mine" aria-label="Profile">
      <i class="fa-solid fa-user"></i>
    </button>
  </nav>

  <div class="toast" id="toast">Saved</div>

  <div class="modal-backdrop" id="profileModal">
    <div class="modal-card">
      <h2>Edit profile</h2>

      <label for="nameInput">Display name</label>
      <input id="nameInput" maxlength="24" placeholder="Your name" />

      <label for="handleInput">Handle</label>
      <input id="handleInput" maxlength="24" placeholder="@username" />

      <div class="modal-actions">
        <button class="cancel-btn" id="cancelProfileBtn">Cancel</button>
        <button class="save-btn" id="saveProfileBtn">Save</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      threads: "threadwave_threads_v1",
      profile: "threadwave_profile_v1",
      theme: "threadwave_theme_v1"
    };

    const DEFAULT_PROFILE = {
      name: "Aurilumix",
      handle: "@futurebillionaire"
    };

    const DEFAULT_THREADS = [
      {
        id: crypto.randomUUID(),
        user: {
          name: "ThreadWave",
          handle: "@threadwave"
        },
        text: "Welcome to ThreadWave 🌊 Build the MVP first. Ship fast. Improve daily. Monetize when users care.",
        createdAt: Date.now() - 1000 * 60 * 34,
        likes: 12,
        reposts: 3,
        liked: false,
        reposted: false,
        mine: false,
        comments: [
          {
            id: crypto.randomUUID(),
            user: "Builder",
            text: "Clean MVP energy.",
            createdAt: Date.now() - 1000 * 60 * 20
          }
        ]
      },
      {
        id: crypto.randomUUID(),
        user: {
          name: "Aurilumix",
          handle: "@futurebillionaire"
        },
        text: "Building apps from scratch. One feature at a time. One money move at a time.",
        createdAt: Date.now() - 1000 * 60 * 7,
        likes: 21,
        reposts: 6,
        liked: true,
        reposted: false,
        mine: true,
        comments: []
      }
    ];

    let profile = loadProfile();
    let threads = loadThreads();
    let activeFilter = "all";

    const body = document.body;
    const themeBtn = document.getElementById("themeBtn");
    const profileBtn = document.getElementById("profileBtn");

    const profileAvatar = document.getElementById("profileAvatar");
    const composerAvatar = document.getElementById("composerAvatar");
    const profileName = document.getElementById("profileName");
    const profileHandle = document.getElementById("profileHandle");

    const postCount = document.getElementById("postCount");
    const likeCount = document.getElementById("likeCount");
    const commentCount = document.getElementById("commentCount");

    const postInput = document.getElementById("postInput");
    const postBtn = document.getElementById("postBtn");
    const charCount = document.getElementById("charCount");
    const feed = document.getElementById("feed");

    const tabButtons = document.querySelectorAll(".tab-btn");
    const navButtons = document.querySelectorAll(".nav-btn[data-filter]");
    const focusComposerBtn = document.getElementById("focusComposerBtn");

    const toast = document.getElementById("toast");

    const profileModal = document.getElementById("profileModal");
    const nameInput = document.getElementById("nameInput");
    const handleInput = document.getElementById("handleInput");
    const cancelProfileBtn = document.getElementById("cancelProfileBtn");
    const saveProfileBtn = document.getElementById("saveProfileBtn");

    init();

    function init() {
      applySavedTheme();
      renderProfile();
      renderThreads();
      bindEvents();
    }

    function bindEvents() {
      themeBtn.addEventListener("click", toggleTheme);

      profileBtn.addEventListener("click", openProfileModal);
      cancelProfileBtn.addEventListener("click", closeProfileModal);
      saveProfileBtn.addEventListener("click", saveProfile);

      profileModal.addEventListener("click", (event) => {
        if (event.target === profileModal) {
          closeProfileModal();
        }
      });

      postInput.addEventListener("input", () => {
        const length = postInput.value.trim().length;
        charCount.textContent = postInput.value.length;
        postBtn.disabled = length === 0;
      });

      postBtn.addEventListener("click", createThread);

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setFilter(button.dataset.filter);
        });
      });

      navButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setFilter(button.dataset.filter);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      focusComposerBtn.addEventListener("click", () => {
        postInput.focus();
        postInput.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function loadProfile() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.profile);
        return saved ? JSON.parse(saved) : DEFAULT_PROFILE;
      } catch {
        return DEFAULT_PROFILE;
      }
    }

    function saveProfileToStorage() {
      localStorage.setItem(STORAGE_KEYS.profile, JSON.stringify(profile));
    }

    function loadThreads() {
      try {
        const saved = localStorage.getItem(STORAGE_KEYS.threads);
        return saved ? JSON.parse(saved) : DEFAULT_THREADS;
      } catch {
        return DEFAULT_THREADS;
      }
    }

    function saveThreads() {
      localStorage.setItem(STORAGE_KEYS.threads, JSON.stringify(threads));
    }

    function applySavedTheme() {
      const savedTheme = localStorage.getItem(STORAGE_KEYS.theme);

      if (savedTheme === "dark") {
        body.classList.add("dark");
        themeBtn.innerHTML = '<i class="fa-regular fa-sun"></i>';
      } else {
        body.classList.remove("dark");
        themeBtn.innerHTML = '<i class="fa-regular fa-moon"></i>';
      }
    }

    function toggleTheme() {
      body.classList.toggle("dark");

      const isDark = body.classList.contains("dark");
      localStorage.setItem(STORAGE_KEYS.theme, isDark ? "dark" : "light");

      themeBtn.innerHTML = isDark
        ? '<i class="fa-regular fa-sun"></i>'
        : '<i class="fa-regular fa-moon"></i>';
    }

    function renderProfile() {
      const initial = profile.name.trim().charAt(0).toUpperCase() || "A";

      profileAvatar.textContent = initial;
      composerAvatar.textContent = initial;
      profileName.textContent = profile.name;
      profileHandle.textContent = normalizeHandle(profile.handle);

      const mine = threads.filter((thread) => thread.mine);
      const totalLikes = threads.reduce((sum, thread) => sum + thread.likes, 0);
      const totalComments = threads.reduce((sum, thread) => {
        return sum + thread.comments.length;
      }, 0);

      postCount.textContent = mine.length;
      likeCount.textContent = totalLikes;
      commentCount.textContent = totalComments;
    }

    function openProfileModal() {
      nameInput.value = profile.name;
      handleInput.value = normalizeHandle(profile.handle).replace("@", "");
      profileModal.classList.add("open");
      nameInput.focus();
    }

    function closeProfileModal() {
      profileModal.classList.remove("open");
    }

    function saveProfile() {
      const name = nameInput.value.trim() || DEFAULT_PROFILE.name;
      const handle = normalizeHandle(handleInput.value.trim() || DEFAULT_PROFILE.handle);

      profile = { name, handle };

      threads = threads.map((thread) => {
        if (!thread.mine) return thread;

        return {
          ...thread,
          user: {
            name: profile.name,
            handle: profile.handle
          }
        };
      });

      saveProfileToStorage();
      saveThreads();
      renderProfile();
      renderThreads();
      closeProfileModal();
      showToast("Profile updated");
    }

    function normalizeHandle(handle) {
      const clean = handle.replace(/\s+/g, "").replace(/^@+/, "");
      return "@" + clean.toLowerCase();
    }

    function createThread() {
      const text = postInput.value.trim();

      if (!text) return;

      const newThread = {
        id: crypto.randomUUID(),
        user: {
          name: profile.name,
          handle: normalizeHandle(profile.handle)
        },
        text,
        createdAt: Date.now(),
        likes: 0,
        reposts: 0,
        liked: false,
        reposted: false,
        mine: true,
        comments: []
      };

      threads.unshift(newThread);
      saveThreads();

      postInput.value = "";
      charCount.textContent = "0";
      postBtn.disabled = true;

      setFilter("all");
      renderProfile();
      renderThreads();
      showToast("Wave posted 🌊");
    }

    function setFilter(filter) {
      activeFilter = filter;

      tabButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      navButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      renderThreads();
    }

    function getFilteredThreads() {
      if (activeFilter === "mine") {
        return threads.filter((thread) => thread.mine);
      }

      if (activeFilter === "hot") {
        return [...threads]
          .filter((thread) => thread.likes + thread.reposts + thread.comments.length > 0)
          .sort((a, b) => {
            const scoreA = a.likes + a.reposts * 2 + a.comments.length * 3;
            const scoreB = b.likes + b.reposts * 2 + b.comments.length * 3;
            return scoreB - scoreA;
          });
      }

      return threads;
    }

    function renderThreads() {
      const visibleThreads = getFilteredThreads();

      if (visibleThreads.length === 0) {
        feed.innerHTML = `
          <div class="empty-card">
            <i class="fa-solid fa-water"></i>
            <h3>No waves yet</h3>
            <p>Post something and start the feed.</p>
          </div>
        `;
        renderProfile();
        return;
      }

      feed.innerHTML = visibleThreads.map(createThreadHTML).join("");

      visibleThreads.forEach((thread) => {
        const card = document.querySelector(`[data-thread-id="${thread.id}"]`);
        if (!card) return;

        const likeButton = card.querySelector(".like-btn");
        const repostButton = card.querySelector(".repost-btn");
        const commentToggle = card.querySelector(".comment-toggle");
        const deleteButton = card.querySelector(".delete-btn");
        const commentForm = card.querySelector(".comment-form");
        const commentInput = card.querySelector(".comment-input");

        likeButton.addEventListener("click", () => toggleLike(thread.id));
        repostButton.addEventListener("click", () => toggleRepost(thread.id));
        commentToggle.addEventListener("click", () => toggleComments(thread.id));

        if (deleteButton) {
          deleteButton.addEventListener("click", () => deleteThread(thread.id));
        }

        commentForm.addEventListener("submit", (event) => {
          event.preventDefault();
          addComment(thread.id, commentInput.value);
        });
      });

      renderProfile();
    }

    function createThreadHTML(thread) {
      const initial = thread.user.name.charAt(0).toUpperCase();
      const commentsOpen = thread.commentsOpen ? "open" : "";
      const commentsHTML = thread.comments.length
        ? thread.comments.map(createCommentHTML).join("")
        : `<div class="comment"><small>ThreadWave</small>No comments yet. Be first.</div>`;

      return `
        <article class="thread-card" data-thread-id="${thread.id}">
          <div class="thread-top">
            <div class="avatar">${escapeHTML(initial)}</div>

            <div class="thread-main">
              <div class="thread-author">
                <div>
                  <h3>${escapeHTML(thread.user.name)}</h3>
                  <span>${escapeHTML(thread.user.handle)} · ${formatTime(thread.createdAt)}</span>
                </div>
              </div>

              <p class="thread-text">${escapeHTML(thread.text)}</p>

              <div class="thread-actions">
                <button class="action-btn like-btn ${thread.liked ? "active like" : ""}">
                  <i class="fa-${thread.liked ? "solid" : "regular"} fa-heart"></i>
                  <span>${thread.likes}</span>
                </button>

                <button class="action-btn comment-toggle">
                  <i class="fa-regular fa-comment"></i>
                  <span>${thread.comments.length}</span>
                </button>

                <button class="action-btn repost-btn ${thread.reposted ? "active repost" : ""}">
                  <i class="fa-solid fa-retweet"></i>
                  <span>${thread.reposts}</span>
                </button>

                ${thread.mine ? `
                  <button class="action-btn delete-btn">
                    <i class="fa-regular fa-trash-can"></i>
                  </button>
                ` : ""}
              </div>

              <div class="comments ${commentsOpen}" id="comments-${thread.id}">
                <div class="comment-list">
                  ${commentsHTML}
                </div>

                <form class="comment-form">
                  <input
                    class="comment-input"
                    type="text"
                    maxlength="120"
                    placeholder="Reply..."
                  />
                  <button type="submit">
                    <i class="fa-solid fa-arrow-up"></i>
                  </button>
                </form>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function createCommentHTML(comment) {
      return `
        <div class="comment">
          <small>${escapeHTML(comment.user)} · ${formatTime(comment.createdAt)}</small>
          ${escapeHTML(comment.text)}
        </div>
      `;
    }

    function toggleLike(id) {
      threads = threads.map((thread) => {
        if (thread.id !== id) return thread;

        const liked = !thread.liked;

        return {
          ...thread,
          liked,
          likes: liked ? thread.likes + 1 : Math.max(0, thread.likes - 1)
        };
      });

      saveThreads();
      renderThreads();
    }

    function toggleRepost(id) {
      threads = threads.map((thread) => {
        if (thread.id !== id) return thread;

        const reposted = !thread.reposted;

        return {
          ...thread,
          reposted,
          reposts: reposted ? thread.reposts + 1 : Math.max(0, thread.reposts - 1)
        };
      });

      saveThreads();
      renderThreads();
    }

    function toggleComments(id) {
      threads = threads.map((thread) => {
        if (thread.id !== id) return thread;

        return {
          ...thread,
          commentsOpen: !thread.commentsOpen
        };
      });

      renderThreads();

      const input = document
        .querySelector(`[data-thread-id="${id}"]`)
        ?.querySelector(".comment-input");

      if (input) {
        setTimeout(() => input.focus(), 100);
      }
    }

    function addComment(id, value) {
      const text = value.trim();

      if (!text) return;

      threads = threads.map((thread) => {
        if (thread.id !== id) return thread;

        return {
          ...thread,
          commentsOpen: true,
          comments: [
            ...thread.comments,
            {
              id: crypto.randomUUID(),
              user: profile.name,
              text,
              createdAt: Date.now()
            }
          ]
        };
      });

      saveThreads();
      renderThreads();
      showToast("Reply added");
    }

    function deleteThread(id) {
      threads = threads.filter((thread) => thread.id !== id);
      saveThreads();
      renderThreads();
      showToast("Wave deleted");
    }

    function formatTime(timestamp) {
      const seconds = Math.floor((Date.now() - timestamp) / 1000);

      if (seconds < 60) return "now";

      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m`;

      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h`;

      const days = Math.floor(hours / 24);
      if (days < 7) return `${days}d`;

      return new Date(timestamp).toLocaleDateString(undefined, {
        month: "short",
        day: "numeric"
      });
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    let toastTimeout;

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimeout);

      toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
      }, 1800);
    }
  </script>
</body>
</html>
